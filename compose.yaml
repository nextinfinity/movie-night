# Standalone server deployment; no source checkout or local build needed.
services:
  movie-night:
    image: ghcr.io/nextinfinity/movie-night:latest
    ports:
      - "8000:8000" # Publishes on all host interfaces; keep access LAN-only.
    environment:
      DEFAULT_USERS: "" # Optional comma-separated Letterboxd usernames
    volumes:
      - movie-night-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  movie-night-data:
